name: Daily Database Backup

on:
  schedule:
    - cron: '0 1 * * *'   # Κάθε μέρα 01:00 UTC (03:00 Ελλάδα)
  workflow_dispatch:        # Χειροκίνητη εκτέλεση από GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Export tables via REST API
        env:
          SUPABASE_URL: https://kqdovhgryckstdnnkpvb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE=$(date +%Y%m%d_%H%M)
          DIR="kydo_backup_${DATE}"
          mkdir -p "$DIR"

          TABLES=(profiles professionals profile_phones unlocks subscriptions reviews job_postings favorites categories)

          for TABLE in "${TABLES[@]}"; do
            curl -s \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              "$SUPABASE_URL/rest/v1/$TABLE?select=*" \
              -o "$DIR/$TABLE.json"
            COUNT=$(cat "$DIR/$TABLE.json" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "?")
            echo "✅ $TABLE — $COUNT rows"
          done

          TOTAL=$(du -sh "$DIR" | cut -f1)
          echo "📦 Total backup size: $TOTAL"
          echo "BACKUP_DIR=$DIR" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kydo-backup-${{ github.run_id }}
          path: kydo_backup_*/
          retention-days: 30

      - name: Summary
        run: |
          echo "## 🗄️ Kydo Database Backup" >> $GITHUB_STEP_SUMMARY
          echo "- **Directory:** \`$BACKUP_DIR\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tables:** profiles, professionals, unlocks, subscriptions, reviews, job_postings, favorites, categories" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention:** 30 days" >> $GITHUB_STEP_SUMMARY
