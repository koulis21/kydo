name: Daily Database Backup

on:
  schedule:
    - cron: '0 1 * * *'   # Κάθε μέρα 01:00 UTC (03:00 Ελλάδα)
  workflow_dispatch:        # Χειροκίνητη εκτέλεση από GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create database backup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date +%Y%m%d_%H%M)
          FILENAME="kydo_backup_${DATE}.sql"

          echo "📦 Creating backup: $FILENAME"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$FILENAME"

          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "✅ Backup complete — size: $SIZE"
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV
          echo "BACKUP_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kydo-db-backup-${{ github.run_id }}
          path: "*.sql"
          retention-days: 30

      - name: Summary
        run: |
          echo "## 🗄️ Kydo Database Backup" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`$BACKUP_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $BACKUP_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention:** 30 days" >> $GITHUB_STEP_SUMMARY
